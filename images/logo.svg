<!--Scalable Vector Graphic-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="gelb" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE766"/>
      <stop offset="0.6" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#D6B400"/>
    </radialGradient>
    <radialGradient id="pad" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5A3A85"/>
      <stop offset="1" stop-color="#2A1446"/>
    </radialGradient>
    <filter id="schatten" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#2A1446" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="32" cy="31" r="28" fill="url(#gelb)" filter="url(#schatten)"/>
  <ellipse cx="22" cy="15" rx="9" ry="5" fill="#FFFBE6" opacity="0.45" transform="rotate(-25 22 15)"/>

  <g fill="url(#pad)">
    <ellipse cx="32" cy="40" rx="11" ry="9"/>
    <ellipse cx="18" cy="29" rx="5" ry="6.5"/>
    <ellipse cx="46" cy="29" rx="5" ry="6.5"/>
    <ellipse cx="26" cy="20" rx="5" ry="6.5"/>
    <ellipse cx="38" cy="20" rx="5" ry="6.5"/>
  </g>
</svg>
